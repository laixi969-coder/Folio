<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Folio · 文章配色对照</title><style>
*{box-sizing:border-box}body{margin:0;background:#eff1ed;color:#26312f;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}header{max-width:1300px;margin:auto;padding:48px 28px 20px}header small{letter-spacing:.2em;color:#72877d;font-size:11px}h1{font-size:28px;margin:12px 0 8px}header p{color:#718078;font-size:14px;line-height:1.8}.group-title{max-width:1244px;margin:30px auto 0;padding:0 28px}.group-title h2{font-size:18px;margin:0 0 5px}.group-title p{font-size:12px;color:#78877f;margin:0}.gallery{max-width:1300px;margin:auto;padding:18px 28px 60px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:25px}.name{display:flex;align-items:baseline;gap:12px;margin:0 0 12px}.name span{font:italic 15px Georgia;color:#8ca39b}.name h2{font-size:15px;margin:0}.paper{background:var(--paper);color:var(--ink);box-shadow:0 12px 35px #40564b16;padding:30px;min-height:460px}.edition{font-size:10px;letter-spacing:.15em;color:var(--accent);border-bottom:1px solid var(--rule);padding-bottom:12px}.title{font-family:Songti SC,STSong,serif;font-size:23px;line-height:1.5;margin:30px 0 14px}.subtitle{font-size:13px;line-height:1.9;color:var(--muted);margin:0 0 30px}.chapter{background:var(--tint);padding:18px;margin:0 0 25px;display:flex;align-items:center;gap:14px}.chapter span{font:30px Georgia;color:var(--accent)}.chapter b{font-family:Songti SC,STSong,serif;font-size:17px}.text{font-size:14px;line-height:2;color:var(--ink)}.quote{border-left:2px solid var(--accent);padding-left:15px;color:var(--accent);font-family:Songti SC,STSong,serif;font-size:16px;margin:26px 0}.swatches{display:flex;gap:6px;margin:13px 0 0}.swatches span{width:26px;height:26px;border-radius:50%;border:1px solid #172b1c16}.note{font-size:11px;color:#819087;margin:7px 0 0;line-height:1.7}@media(max-width:800px){.gallery{grid-template-columns:1fr;max-width:480px}header{padding-top:30px}.paper{min-height:0}}
</style></head><body><header><small>FOLIO / COLOUR STUDY</small><h1>文章配色对照</h1><p>新增的配色提案与现有配色放在一起。每一款使用相同内容和标题形式，方便比较颜色。</p></header><section class="group-title"><h2>新增的正式配色</h2><p>这 12 组配色已加入 Folio，可在文章配色中选择。</p></section><div id="new-gallery" class="gallery"></div><section class="group-title"><h2>Folio 现有配色</h2><p>保留作为参照。</p></section><main id="gallery" class="gallery"></main><script type="module">
import {ARTICLE_PALETTES,NEW_PALETTE_IDS} from '/article-palettes.js';
const newPalettes=ARTICLE_PALETTES.filter(p=>NEW_PALETTE_IDS.includes(p.id));
const existingPalettes=ARTICLE_PALETTES.filter(p=>!NEW_PALETTE_IDS.includes(p.id));
function renderPalettes(list,gallery,prefix){list.forEach((p,i)=>{const card=document.createElement('section');card.innerHTML=`<div class="name"><span>${prefix}${String(i+1).padStart(2,'0')}</span><h2>${p.name}</h2></div><div class="paper" style="--paper:${p.paper};--ink:${p.ink};--accent:${p.accent};--muted:${p.muted};--rule:${p.rule};--tint:${p.tint}"><div class="edition">简序 · 长文</div><h3 class="title">把日子，过回自己的节奏</h3><p class="subtitle">有些值得记住的时刻，<br>就藏在那些不赶时间的日子里。</p><div class="chapter"><span>01</span><b>慢一点，才看得见</b></div><p class="text">以前经过这条街，我总是低着头看手机。导航告诉我还剩几分钟，却很少让我知道，自己正经过什么。</p><p class="quote">留一点没有安排的时间。</p></div><div class="swatches"><span style="background:${p.accent}"></span><span style="background:${p.paper}"></span><span style="background:${p.tint}"></span><span style="background:${p.ink}"></span></div><p class="note">强调色 · 纸色 · 浅底色 · 正文色</p>`;gallery.appendChild(card)});}
renderPalettes(newPalettes,document.getElementById('new-gallery'),'新 ');renderPalettes(existingPalettes,document.getElementById('gallery'),'现有 ');
</script></body></html>
