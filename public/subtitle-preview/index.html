<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Folio · 题记与图注排印对照</title><style>
*{box-sizing:border-box}body{margin:0;background:#eeefeb;color:#26312f;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}header{max-width:1260px;margin:auto;padding:52px 28px 22px}header small{letter-spacing:.22em;color:#718782;font-size:11px}header h1{font-size:29px;letter-spacing:-.04em;margin:14px 0 8px}header p{color:#6f7a74;font-size:14px;line-height:1.9;margin:0;max-width:760px}.gallery-heading{max-width:1260px;margin:34px auto 0;padding:0 28px}.gallery-heading h2{font-size:18px;margin:0 0 5px}.gallery-heading p{font-size:12px;color:#7b8780;margin:0;line-height:1.9}.gallery{max-width:1260px;margin:auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;padding:18px 28px 24px}.option{min-width:0;position:relative}.label{display:flex;align-items:baseline;gap:11px;margin:0 0 13px}.label span{font:italic 15px Georgia,serif;color:#8ca39b}.label h2{font-size:15px;margin:0;font-weight:600}.label p{font-size:11px;color:#87908b;margin:0}.default-tag{position:absolute;right:0;top:0;font-size:10px;letter-spacing:.12em;color:#fff;background:#426b64;padding:3px 7px;border-radius:3px}.paper{background:#fffefa;box-shadow:0 12px 35px #40564b12;min-height:420px;padding:34px 30px 38px}.edition{font-size:10px;letter-spacing:.14em;color:#587e72;border-bottom:1px solid #dfe7e1;padding-bottom:12px}.title{font-family:"Songti SC","STSong",serif;font-size:25px;line-height:1.45;letter-spacing:.04em;margin:30px 0 0;color:#282d2a}.body{font-size:14px;line-height:2.05;color:#4b5651;margin:0}.body+.body{margin-top:16px}.caption-lab{max-width:1260px;margin:auto;padding:18px 28px 70px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.cap-row{background:#fffefa;box-shadow:0 12px 35px #40564b12;padding:22px 24px 26px;min-width:0}.cap-meta{display:flex;align-items:baseline;gap:10px;border-bottom:1px solid #e7ebe6;padding-bottom:12px;margin-bottom:18px}.cap-meta b{font:italic 20px/1 Georgia,serif;color:#426b64}.cap-meta strong{font-size:13px}.cap-meta span{font-size:11px;color:#8b958d;margin-left:auto}.fake-photo{height:112px;background:linear-gradient(135deg,#dfe7e1 0%,#cdd9d2 45%,#b8c9c0 100%);position:relative}.fake-photo:after{content:"";position:absolute;left:18%;top:28%;width:36%;height:52%;background:#aebfb5;opacity:.65;transform:rotate(-4deg)}footer{max-width:1260px;margin:auto;padding:0 28px 60px;font-size:12px;color:#8b958d}@media(max-width:980px){.gallery{grid-template-columns:repeat(2,minmax(0,1fr))}.caption-lab{grid-template-columns:1fr}}@media(max-width:640px){header,.gallery-heading,.gallery,.caption-lab,footer{padding-left:18px;padding-right:18px}.gallery{grid-template-columns:1fr}.paper{padding:26px 22px 30px}}
</style></head><body>
<header><small>FOLIO / TYPOGRAPHY STUDY</small><h1>题记与图注，重新排过</h1><p>开篇副标题六款版式；图片说明按「辅助 · 单图 · 整组 · 特写」四级字号区隔。下面全部由编辑器、阅读预览与导出共用的同一套渲染函数生成，不是另画的样稿。</p></header>
<section class="gallery-heading"><h2>开篇题记 · 六款</h2><p>默认「眉题竖线」。在 Folio 右侧「开篇题记 · 版式」中整篇切换，字号仍可单独微调。</p></section>
<main class="gallery" id="decks"></main>
<section class="gallery-heading"><h2>图注 · 四级字号</h2><p>字号随正文字号推导：正文 16px 时为 11 / 13 / 15 / 24px。图注里写「主说明 ｜ 来源或补充」会自动分出更小一号的次级说明。</p></section>
<section class="caption-lab" id="captions"></section>
<footer>样稿仅用于比较，不修改任何文章或已保存的默认风格。</footer>
<script type="module">
import {SUBTITLE_SERIES,DEFAULT_SUBTITLE_SERIES,subtitleHTML} from '/subtitle-series.js';
import {captionHTML,captionTypography} from '/caption-type.js';
const base={preset:'magazine',headingSeries:'editorial',paletteId:'celadon',fontSize:16,subtitleSize:15,titleSize:31,sidePadding:30,accent:'#426B64'};
const decks=document.getElementById('decks');
SUBTITLE_SERIES.forEach((s,i)=>{
 const card=document.createElement('section');card.className='option';
 card.innerHTML=`<div class="label"><span>${String(i+1).padStart(2,'0')}</span><h2>${s.name}</h2><p>${s.description}</p></div>${s.id===DEFAULT_SUBTITLE_SERIES?'<span class="default-tag">默认</span>':''}<div class="paper"><div class="edition">简序 · 长文</div><h3 class="title">把日子，过回自己的节奏</h3>${subtitleHTML({...base,subtitleSeries:s.id},'有些值得记住的时刻，就藏在那些不赶时间的日子里。')}<p class="body">以前经过这条街，我总是低着头看手机。导航告诉我还剩几分钟，却很少让我知道，自己正经过什么。</p><p class="body">那天没有着急回的消息，我坐下来，听老板讲起这条街的变化。</p></div>`;
 decks.appendChild(card);
});
const t=captionTypography(base);
const samples=[
 {name:'辅助 / 来源',size:t.note,desc:'提示、署名、图片编号',photo:false,html:captionHTML(base,'左右滑动查看','note')},
 {name:'单图图注',size:t.item,desc:'竖线 + 主说明 ｜ 次级来源',photo:true,html:captionHTML(base,'午后三点，光停在旧椅背上 ｜ 摄影：作者','item')},
 {name:'整组说明',size:t.group,desc:'短线引导 + 宋体总说明',photo:false,html:captionHTML(base,'这一组都拍于同一条街 ｜ 2026 年秋','group')},
 {name:'特写说明',size:t.feature,desc:'色块 + 眉标 + 大字题注',photo:false,html:captionHTML(base,'慢一点，才看得见','feature')}
];
const lab=document.getElementById('captions');
for(const s of samples){
 const row=document.createElement('div');row.className='cap-row';
 row.innerHTML=`<div class="cap-meta"><b>${s.size}px</b><strong>${s.name}</strong><span>${s.desc}</span></div>${s.photo?'<div class="fake-photo"></div>':''}${s.html}`;
 lab.appendChild(row);
}
</script></body></html>
